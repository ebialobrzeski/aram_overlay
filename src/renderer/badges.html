<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>ARAM Comp Overlay badges</title>
  <link rel="stylesheet" href="badges.css" />
</head>
<body>
  <div id="layer"></div>
  <div id="calib" hidden>
    <div class="panel">
      <b>Calibrate badge positions</b>
      <span>Drag <em>Bench 1</em> onto the first bench champion and <em>Bench 10</em> where the tenth would be. Drag <em>Row 1</em> onto the top teammate portrait and <em>Row 5</em> onto the bottom one. Ghost dots show where the other slots land.</span>
      <span class="btns"><button id="save">Save</button><button id="cancel">Cancel</button></span>
    </div>
  </div>
  <script src="badges.js"></script>
</body>
</html>
