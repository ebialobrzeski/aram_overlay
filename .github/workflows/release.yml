name: Release

# Builds the Windows installer + portable exe on the self-hosted runner (myoung34/github-runner on the NAS)
# and attaches them to the GitHub release of the tag. GitHub-hosted runners are not used (billing).
# Manual fallback without the runner: deploy/nas/release.sh (see deploy/nas/README.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Make sure the Electron binary is present
        run: node node_modules/electron/install.js

      - name: Test
        run: npm test

      - name: Package (installer + portable, Windows targets cross-built on Linux)
        run: npm run package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aram-overlay-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
