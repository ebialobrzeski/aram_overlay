name: Release

# Builds the Windows installer + portable exe on the self-hosted runner (myoung34/github-runner on the NAS)
# and attaches them to the GitHub release of the tag. GitHub-hosted runners are not used (billing).
# Manual fallback without the runner: deploy/nas/release.sh (see deploy/nas/README.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: [self-hosted, nas]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # the tag is the source of truth for the version: file names come from package.json
      - name: Set the package version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Make sure the Electron binary is present
        run: node node_modules/electron/install.js

      - name: Test
        run: npm test

      # NSIS on Linux needs Wine, which the runner image lacks: package inside electron-builder's image instead.
      - name: Package (installer + portable, inside electronuserland/builder:wine)
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker is not available on this runner (mount /var/run/docker.sock into the runner container)"; exit 1; }
          docker run --rm             -v "$PWD":/project -w /project             -v aram-overlay-electron-cache:/root/.cache/electron             -v aram-overlay-builder-cache:/root/.cache/electron-builder             electronuserland/builder:wine             sh -c "node scripts/build.mjs && npx electron-builder --win --publish never"
          ls -l release/*.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aram-overlay-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
